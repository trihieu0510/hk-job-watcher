name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # watcher_lib and _reaction_poller are stdlib-only, so there is nothing to
      # install -- no pip step, no Playwright, no browser download.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
